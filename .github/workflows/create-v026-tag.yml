name: Create v0.2.6 tag helper

on:
  push:
    branches:
      - chore/tag-v026
    paths:
      - .github/workflows/create-v026-tag.yml

permissions:
  contents: write

jobs:
  tag:
    if: github.actor == 'gODtECH-Ctl-Create'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create guarded annotated tag
        shell: bash
        run: |
          set -euo pipefail
          target='26384b63e06e6e7cd63949c74c392bae5ba886a0'
          git fetch origin main --tags
          actual="$(git rev-parse origin/main)"
          if [[ "$actual" != "$target" ]]; then
            echo "main moved: expected $target, got $actual" >&2
            exit 1
          fi
          if git rev-parse -q --verify refs/tags/v0.2.6 >/dev/null; then
            existing="$(git rev-list -n 1 v0.2.6)"
            [[ "$existing" == "$target" ]] || { echo "v0.2.6 exists at $existing, expected $target" >&2; exit 1; }
            exit 0
          fi
          git config user.name "gODtECH-Ctl-Create"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.6 "$target" -m "StackPilot v0.2.6"
          git push origin refs/tags/v0.2.6
