name: Implement Terraform remediation helper

on:
  push:
    branches:
      - feat/fix-terraform

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/fix-terraform
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply patch
        run: python .github/scripts/patch_terraform.py
      - name: Format and validate
        run: |
          cargo fmt --all
          cargo check --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/fix.rs .github/workflows/ci.yml docs/remediation.md
          git commit -m 'feat: add explicit-cloud Terraform remediation'
          git push origin HEAD:feat/fix-terraform
