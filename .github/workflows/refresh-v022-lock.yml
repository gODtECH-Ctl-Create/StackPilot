name: Refresh v0.2.2 lock helper

on:
  push:
    branches:
      - release/v0.2.2

permissions:
  contents: write

jobs:
  refresh-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/v0.2.2
          fetch-depth: 0

      - name: Refresh Cargo.lock through Cargo
        run: cargo check

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -A3 '^\[package\]' Cargo.toml | grep -q 'version = "0.2.2"'
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('Cargo.lock').read_text())
          packages = [p for p in data['package'] if p['name'] == 'stackpilot']
          assert len(packages) == 1, packages
          assert packages[0]['version'] == '0.2.2', packages[0]
          site = Path('website/src/data/site.ts').read_text()
          assert "currentVersion: '0.2.2'" in site
          PY

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build website
        working-directory: website
        run: |
          npm install
          npm run build

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Cargo.lock for v0.2.2"
          git push origin HEAD:release/v0.2.2
