name: Implement security baseline helper

on:
  push:
    branches:
      - feat/security-baseline

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/security-baseline

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Wire security inspection and remediation
        run: python .github/scripts/patch_security.py

      - name: Format and validate
        run: |
          cargo fmt --all
          cargo check --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/inspect.rs src/fix.rs
          git commit -m 'feat: wire security baseline inspection and remediation'
          git push origin HEAD:feat/security-baseline
