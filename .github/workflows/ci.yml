name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all

      - name: Validate installer syntax
        run: |
          bash -n scripts/install.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw scripts/install.ps1))'

      - name: Smoke test generic project creation
        run: |
          cargo run --locked -- new ci-smoke --recipe base --non-interactive --no-git
          test -f ci-smoke/.stackpilot.toml
          test -f ci-smoke/docs/architecture.md

      - name: Build CLI
        run: cargo build --locked

      - name: Smoke test repository readiness
        run: |
          ./target/debug/stackpilot inspect . > inspect.txt
          grep -Eq '^StackPilot Readiness: [0-9]+/100$' inspect.txt
          grep -q '^Model: readiness-v1$' inspect.txt
          grep -q '^Languages: .*Rust' inspect.txt
          grep -q '^Category scores$' inspect.txt
          grep -q '^Controls$' inspect.txt
          grep -q 'CI/CD' inspect.txt

          ./target/debug/stackpilot inspect . --fail-below 0 > threshold-pass.txt
          grep -q '^Required threshold: 0$' threshold-pass.txt
          grep -q 'meets the required threshold' threshold-pass.txt

          rm -rf /tmp/stackpilot-readiness-empty
          mkdir -p /tmp/stackpilot-readiness-empty
          printf '# empty\n' > /tmp/stackpilot-readiness-empty/README.md
          if ./target/debug/stackpilot inspect /tmp/stackpilot-readiness-empty --fail-below 100 > threshold-fail.txt 2>&1; then
            echo 'expected --fail-below 100 to fail for an empty repository'
            exit 1
          fi
          grep -q '^Required threshold: 100$' threshold-fail.txt
          grep -q 'below the required threshold' threshold-fail.txt

      - name: Smoke test installed recipe resolution
        run: |
          rm -rf /tmp/stackpilot-install /tmp/stackpilot-user
          mkdir -p /tmp/stackpilot-install /tmp/stackpilot-user
          cp target/debug/stackpilot /tmp/stackpilot-install/stackpilot
          cp -R recipes /tmp/stackpilot-install/recipes
          cd /tmp/stackpilot-user
          /tmp/stackpilot-install/stackpilot doctor
          /tmp/stackpilot-install/stackpilot recipes | grep -q '^base - '
          /tmp/stackpilot-install/stackpilot plan installed-smoke --recipe base --non-interactive > plan.txt
          grep -q '.stackpilot.toml' plan.txt

      - name: Smoke test GitHub template bootstrap
        run: |
          mkdir -p /tmp/stackpilot-bootstrap
          git archive HEAD | tar -x -C /tmp/stackpilot-bootstrap
          cp target/debug/stackpilot /tmp/stackpilot-bin
          cd /tmp/stackpilot-bootstrap
          /tmp/stackpilot-bin bootstrap --recipe base --non-interactive
          test -f .stackpilot.toml
          test ! -f .stackpilot-template
          test ! -f Cargo.toml
          test ! -d recipes

  golden-paths:
    name: golden / ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: Rust
            framework: Axum
            slug: rust-smoke
          - language: Go
            framework: Chi
            slug: go-smoke
          - language: TypeScript
            framework: NestJS
            slug: nest-smoke
          - language: Python
            framework: FastAPI
            slug: fastapi-smoke
          - language: Java
            framework: Spring Boot
            slug: spring-smoke
          - language: C#
            framework: ASP.NET Core
            slug: dotnet-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust for StackPilot
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        if: matrix.language == 'Go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Node.js
        if: matrix.language == 'TypeScript'
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up Python
        if: matrix.language == 'Python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Set up Java
        if: matrix.language == 'Java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET
        if: matrix.language == 'C#'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build StackPilot
        run: cargo build --locked --release

      - name: Generate golden path
        run: |
          ./target/release/stackpilot new "${{ matrix.slug }}" \
            --recipe base \
            --non-interactive \
            --kind "Backend API" \
            --language "${{ matrix.language }}" \
            --framework "${{ matrix.framework }}" \
            --database PostgreSQL \
            --cloud AWS \
            --docker true \
            --ci true \
            --terraform true \
            --no-git
          test -f "${{ matrix.slug }}/Dockerfile"
          test -f "${{ matrix.slug }}/compose.yaml"
          test -f "${{ matrix.slug }}/.github/workflows/ci.yml"
          test -f "${{ matrix.slug }}/infra/terraform/main.tf"

      - name: Validate Rust output
        if: matrix.language == 'Rust'
        run: cargo check --manifest-path "${{ matrix.slug }}/Cargo.toml"

      - name: Validate Go output
        if: matrix.language == 'Go'
        working-directory: ${{ matrix.slug }}
        run: |
          go mod tidy
          go test ./...
          go vet ./...

      - name: Validate NestJS output
        if: matrix.language == 'TypeScript'
        working-directory: ${{ matrix.slug }}
        run: |
          npm install
          npm run build

      - name: Validate FastAPI output
        if: matrix.language == 'Python'
        working-directory: ${{ matrix.slug }}
        run: |
          python -m pip install -e '.[dev]'
          pytest -q

      - name: Validate Spring Boot output
        if: matrix.language == 'Java'
        working-directory: ${{ matrix.slug }}
        run: mvn -B verify

      - name: Validate ASP.NET Core output
        if: matrix.language == 'C#'
        working-directory: ${{ matrix.slug }}
        run: dotnet build app.csproj --configuration Release

  website:
    name: website / Astro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install website dependencies
        working-directory: website
        run: npm install

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Verify static pages
        run: |
          test -f website/dist/index.html
          test -f website/dist/install/index.html
          test -f website/dist/docs/index.html
          test -f website/dist/golden-paths/index.html
