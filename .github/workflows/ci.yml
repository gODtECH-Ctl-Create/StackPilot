name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Smoke test generic project creation
        run: |
          cargo run -- new ci-smoke --recipe base --non-interactive --no-git
          test -f ci-smoke/.stackpilot.toml
          test -f ci-smoke/docs/architecture.md

      - name: Smoke test Rust Axum golden path
        run: |
          cargo run -- new axum-smoke \
            --recipe base \
            --non-interactive \
            --kind "Backend API" \
            --language Rust \
            --framework Axum \
            --database PostgreSQL \
            --cloud AWS \
            --docker true \
            --ci true \
            --terraform true \
            --no-git
          test -f axum-smoke/Cargo.toml
          test -f axum-smoke/src/main.rs
          test -f axum-smoke/Dockerfile
          test -f axum-smoke/compose.yaml
          test -f axum-smoke/.github/workflows/ci.yml
          test -f axum-smoke/infra/terraform/main.tf
          cargo check --manifest-path axum-smoke/Cargo.toml

      - name: Build CLI
        run: cargo build

      - name: Smoke test GitHub template bootstrap
        run: |
          mkdir -p /tmp/stackpilot-bootstrap
          git archive HEAD | tar -x -C /tmp/stackpilot-bootstrap
          cp target/debug/stackpilot /tmp/stackpilot-bin
          cd /tmp/stackpilot-bootstrap
          /tmp/stackpilot-bin bootstrap --recipe base --non-interactive
          test -f .stackpilot.toml
          test ! -f .stackpilot-template
          test ! -f Cargo.toml
          test ! -d recipes
