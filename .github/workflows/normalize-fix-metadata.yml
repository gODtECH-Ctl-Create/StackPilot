name: Normalize repository fix metadata

on:
  push:
    branches: [feat/repository-fix]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/repository-fix

      - name: Keep adopted metadata schema-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/fix.rs')
          text = path.read_text()
          text = text.replace(
              'content: stackpilot_metadata(root, report)?,',
              'content: stackpilot_metadata(root, report),',
          )

          replacement = r'''fn stackpilot_metadata(root: &Path, report: &InspectionReport) -> String {
              let name = toml_string(&repository_name(root));
              let detected_language = single_value(&report.languages).unwrap_or("Generic");
              let language = normalized_language(detected_language);
              let framework = normalized_framework(language, single_value(&report.frameworks));
              let docker = finding_status(report, "Docker") == Some(FindingStatus::Passed);
              let ci = finding_status(report, "CI/CD") == Some(FindingStatus::Passed);
              let terraform = finding_status(report, "Terraform") == Some(FindingStatus::Passed);
              let detected_languages = toml_array(&report.languages);
              let detected_frameworks = toml_array(&report.frameworks);

              format!(
                  "version = 1\n\n[project]\nname = \"{name}\"\nkind = \"Generic\"\nlanguage = \"{language}\"\nframework = \"{framework}\"\ndatabase = \"None\"\ncloud = \"None\"\n\n[features]\ndocker = {docker}\nci = {ci}\nterraform = {terraform}\n\n[stackpilot]\nrecipe = \"adopted\"\nmanaged = false\n\n[detected]\nlanguages = {detected_languages}\nframeworks = {detected_frameworks}\n"
              )
          }

          fn normalized_language(language: &str) -> &str {
              match language {
                  "Rust" | "Go" | "TypeScript" | "Python" | "Java" | "C#" => language,
                  _ => "Generic",
              }
          }

          fn normalized_framework<'a>(language: &str, framework: Option<&'a str>) -> &'a str {
              match (language, framework) {
                  ("Rust", Some("Axum")) => "Axum",
                  ("Go", Some("Chi")) => "Chi",
                  ("TypeScript", Some("NestJS")) => "NestJS",
                  ("Python", Some("FastAPI")) => "FastAPI",
                  ("Java", Some("Spring Boot")) => "Spring Boot",
                  ("C#", Some("ASP.NET Core")) => "ASP.NET Core",
                  _ => "None",
              }
          }

          fn toml_array(values: &[String]) -> String {
              let values = values
                  .iter()
                  .map(|value| format!("\"{}\"", toml_string(value)))
                  .collect::<Vec<_>>()
                  .join(", ");
              format!("[{values}]")
          }

          fn repository_name'''

          text, count = re.subn(
              r'fn stackpilot_metadata\(root: &Path, report: &InspectionReport\) -> Result<String> \{.*?\n\}\n\nfn repository_name',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('stackpilot_metadata function was not replaced exactly once')

          path.write_text(text)
          PY

      - name: Format and test compile surface
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit metadata normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fix.rs
          git commit -m 'refactor: keep adopted metadata schema-safe'
          git push origin HEAD:feat/repository-fix
