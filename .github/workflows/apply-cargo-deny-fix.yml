name: Apply cargo-deny field fix

on:
  push:
    branches:
      - fix/cargo-deny-dependency-scan
    paths:
      - .github/workflows/apply-cargo-deny-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'gODtECH-Ctl-Create'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/cargo-deny-dependency-scan
      - name: Apply patch
        run: python .tmp/apply_cargo_deny_fix.py
      - name: Format and validate
        run: |
          cargo fmt
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Commit product fix
        run: |
          git config user.name "gODtECH-Ctl-Create"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/security.rs
          git commit -m "fix: recognize cargo-deny advisory scans"
          git push origin HEAD:fix/cargo-deny-dependency-scan
