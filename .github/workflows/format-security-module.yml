name: Format security module helper

on:
  push:
    branches:
      - feat/security-baseline

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/security-baseline

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format security module
        run: cargo fmt --all

      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/security.rs
          git diff --cached --quiet || git commit -m 'style: apply rustfmt to security baseline'
          git push origin HEAD:feat/security-baseline
