name: Dispatch v0.2.6 installed smoke helper

on:
  push:
    branches:
      - chore/dispatch-v026-smoke
    paths:
      - .github/workflows/dispatch-v026-smoke.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.actor == 'gODtECH-Ctl-Create'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Installed Release Smoke
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-smoke.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag=v0.2.6
