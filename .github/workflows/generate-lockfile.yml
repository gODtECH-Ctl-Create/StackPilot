name: Generate Cargo.lock

on:
  push:
    branches:
      - chore/release-hardening
    paths:
      - '.github/workflows/generate-lockfile.yml'
      - 'Cargo.toml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/release-hardening

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Commit Cargo.lock
        run: |
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: commit Cargo.lock for reproducible builds"
          git push origin HEAD:chore/release-hardening
