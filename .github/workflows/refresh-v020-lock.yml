name: Refresh v0.2 lock helper

on:
  push:
    branches:
      - release/v0.2.0

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.2.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Refresh lockfile and validate release metadata
        run: |
          set -euo pipefail
          cargo check --all-targets --all-features
          grep -A2 'name = "stackpilot"' Cargo.lock | grep -q 'version = "0.2.0"'
          grep -q "currentVersion: '0.2.0'" website/src/data/site.ts
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all --locked

      - name: Commit refreshed lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --quiet || git commit -m 'chore: refresh Cargo.lock for v0.2.0'
          git push origin HEAD:release/v0.2.0
