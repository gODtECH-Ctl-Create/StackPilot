name: Tag v0.2.4 helper

on:
  push:
    branches:
      - release/v0.2.4

permissions:
  contents: write

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create guarded v0.2.4 tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          EXPECTED='4ef4d96f04c7862e80597deec6c9fe147676094e'
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$MAIN_SHA" = "$EXPECTED" || { echo "main moved: $MAIN_SHA"; exit 1; }
          if git rev-parse -q --verify refs/tags/v0.2.4 >/dev/null; then
            echo 'v0.2.4 already exists'
            exit 1
          fi
          git config user.name 'gODtECH-Ctl-Create'
          git config user.email 'ayoabe24@gmail.com'
          git tag -a v0.2.4 "$EXPECTED" -m 'StackPilot v0.2.4'
          git push origin v0.2.4
