name: Apply upgrade wiring helper

on:
  push:
    branches:
      - feat/golden-path-upgrade

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/golden-path-upgrade

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Wire lifecycle CLI command
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/main.rs")
          text = path.read_text()
          text = text.replace("mod steward;\n", "mod steward;\nmod upgrade;\n", 1)
          anchor = '''    /// List available StackPilot recipes.\n    Recipes {'''
          command = '''    /// Preview or apply a StackPilot-managed golden-path lifecycle upgrade.\n    Upgrade {\n        /// StackPilot-managed repository to upgrade. Defaults to the current directory.\n        #[arg(default_value = ".")]\n        path: PathBuf,\n\n        /// Directory that contains StackPilot recipes used by lifecycle migrations.\n        #[arg(long, default_value = "recipes")]\n        recipes_dir: PathBuf,\n\n        /// Apply the planned managed-foundation changes. Without this flag, upgrade is a preview.\n        #[arg(long)]\n        apply: bool,\n    },\n\n'''
          if anchor not in text:
              raise SystemExit("upgrade command anchor missing")
          text = text.replace(anchor, command + anchor, 1)

          anchor = '''        Commands::Recipes { recipes_dir } => {'''
          arm = '''        Commands::Upgrade {\n            path,\n            recipes_dir,\n            apply,\n        } => {\n            let recipes_dir = resolve_recipes_dir(recipes_dir);\n            upgrade::run(&path, &recipes_dir, apply)?;\n        }\n'''
          if anchor not in text:
              raise SystemExit("upgrade match anchor missing")
          text = text.replace(anchor, arm + anchor, 1)
          path.write_text(text)

      - name: Format and validate lifecycle changes
        run: |
          cargo fmt --all
          cargo check --all-targets --all-features --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all --locked

      - name: Commit permanent wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/upgrade.rs recipes/base/templates/stackpilot.toml.j2
          git diff --cached --quiet || git commit -m 'feat: wire golden path lifecycle upgrade'
          git push origin HEAD:feat/golden-path-upgrade
