name: Refresh v0.2.4 lock helper

on:
  push:
    branches:
      - release/v0.2.4

permissions:
  contents: write

jobs:
  refresh-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/v0.2.4

      - name: Refresh Cargo.lock through Cargo
        run: cargo generate-lockfile

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -A3 '^name = "stackpilot"$' Cargo.lock | grep -F 'version = "0.2.4"'
          grep -F 'version = "0.2.4"' Cargo.toml
          grep -F "currentVersion: '0.2.4'" website/src/data/site.ts

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git commit -m 'chore: refresh lockfile for v0.2.4'
          git push origin HEAD:release/v0.2.4
