name: Dispatch v0.2.4 release helper

on:
  push:
    branches:
      - release/v0.2.4

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable v0.2.4 tag
        shell: bash
        run: |
          set -euo pipefail
          expected='4ef4d96f04c7862e80597deec6c9fe147676094e'
          tagged="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/tags/v0.2.4^{} | awk '{print $1}')"
          test "$tagged" = "$expected" || { echo "v0.2.4 tag mismatch: $tagged"; exit 1; }

      - name: Dispatch canonical release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -f ref=main \
            -f 'inputs[tag]=v0.2.4'
