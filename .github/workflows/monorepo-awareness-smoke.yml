name: Monorepo awareness smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  monorepo-awareness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build StackPilot
        run: cargo build --locked

      - name: Exercise nested service scope
        shell: bash
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/target/debug/stackpilot"
          ROOT="$(mktemp -d)/mortgageops"
          SERVICE="$ROOT/services/api"

          mkdir -p "$ROOT/.git" "$ROOT/.github/workflows" "$ROOT/infra/docker" "$SERVICE/src"
          cat > "$ROOT/.github/workflows/ci.yml" <<'YAML'
          name: CI
          permissions:
            contents: read
          YAML
          printf 'PORT=3000\n' > "$ROOT/.env.example"
          printf '.env\n' > "$ROOT/.gitignore"
          printf "lockfileVersion: '9.0'\n" > "$ROOT/pnpm-lock.yaml"
          cat > "$ROOT/infra/docker/api.Dockerfile" <<'DOCKER'
          FROM node:22-alpine
          COPY services/api/package.json services/api/package.json
          COPY services/api services/api
          DOCKER
          cat > "$ROOT/infra/docker/docker-compose.yml" <<'YAML'
          services:
            api:
              build:
                context: ../..
                dockerfile: infra/docker/api.Dockerfile
          YAML

          cat > "$SERVICE/package.json" <<'JSON'
          {
            "name": "@mortgageops/api",
            "scripts": {
              "build": "tsc -p tsconfig.json",
              "start": "node dist/main.js"
            },
            "dependencies": {
              "@nestjs/core": "12.0.1",
              "@nestjs/platform-express": "12.0.1"
            },
            "devDependencies": {
              "typescript": "7.0.2"
            }
          }
          JSON
          printf '{}\n' > "$SERVICE/tsconfig.json"
          cat > "$SERVICE/src/main.ts" <<'TS'
          const path = '/health';
          console.log(path);
          TS

          "$BIN" inspect "$SERVICE" | tee /tmp/nested-inspect.txt
          grep -F 'StackPilot Readiness: 85/100' /tmp/nested-inspect.txt
          grep -F 'Repository root:' /tmp/nested-inspect.txt
          grep -F 'Inherited from repository root: centralized Dockerfile and Compose detected (infra/docker/api.Dockerfile, infra/docker/docker-compose.yml)' /tmp/nested-inspect.txt
          grep -F 'Inherited from repository root: GitHub Actions' /tmp/nested-inspect.txt
          grep -F 'Inherited from repository root: Safe example detected' /tmp/nested-inspect.txt
          grep -F 'Lockfile detected (pnpm-lock.yaml)' /tmp/nested-inspect.txt
          grep -F 'Dockerfile detected without a container image scan' /tmp/nested-inspect.txt

          "$BIN" fix "$SERVICE" --recipes-dir "$GITHUB_WORKSPACE/recipes" | tee /tmp/nested-fix.txt
          grep -F '+ create .stackpilot.toml' /tmp/nested-fix.txt
          if grep -Fq '+ create Dockerfile' /tmp/nested-fix.txt || grep -Fq '+ create compose.yaml' /tmp/nested-fix.txt || grep -Fq '+ create .dockerignore' /tmp/nested-fix.txt; then
            echo 'centralized Docker ownership must suppress duplicate container remediation'
            exit 1
          fi
          if grep -Fq '+ create .github/workflows/ci.yml' /tmp/nested-fix.txt; then
            echo 'nested CI workflow must never be planned'
            exit 1
          fi
          if grep -Fq '+ create .env.example' /tmp/nested-fix.txt || grep -Fq '+ create .gitignore' /tmp/nested-fix.txt; then
            echo 'inherited environment controls must not be recreated inside the service'
            exit 1
          fi
          test ! -e "$SERVICE/Dockerfile"
          test ! -e "$SERVICE/.stackpilot.toml"

          FASTAPI_ROOT="$(mktemp -d)/fastapi-template"
          FASTAPI_BACKEND="$FASTAPI_ROOT/backend"
          mkdir -p "$FASTAPI_ROOT/.git" "$FASTAPI_ROOT/.github/workflows" "$FASTAPI_BACKEND/app"
          cat > "$FASTAPI_ROOT/.github/workflows/ci.yml" <<'YAML'
          name: CI
          permissions:
            contents: read
          YAML
          cat > "$FASTAPI_ROOT/.env" <<'ENV'
          SECRET_KEY=changethis
          FIRST_SUPERUSER_PASSWORD=changethis
          ENV
          printf 'node_modules/\n' > "$FASTAPI_ROOT/.gitignore"
          printf 'version = 1\n' > "$FASTAPI_ROOT/uv.lock"
          cat > "$FASTAPI_BACKEND/pyproject.toml" <<'TOML'
          [project]
          name = "app"
          version = "0.1.0"
          dependencies = ["fastapi"]
          TOML
          cat > "$FASTAPI_BACKEND/Dockerfile" <<'DOCKER'
          FROM python:3.13-slim
          COPY . /app
          DOCKER
          cat > "$FASTAPI_BACKEND/app/main.py" <<'PY'
          from fastapi import FastAPI
          app = FastAPI()

          @app.get('/health-check/')
          async def health_check():
              return True
          PY

          "$BIN" inspect "$FASTAPI_BACKEND" | tee /tmp/fastapi-inspect.txt
          grep -F 'Inherited from repository root: .env is present without detected .gitignore protection' /tmp/fastapi-inspect.txt

          "$BIN" fix "$FASTAPI_BACKEND" --recipes-dir "$GITHUB_WORKSPACE/recipes" | tee /tmp/fastapi-fix.txt
          grep -F '! Environment config — environment configuration is inherited from repository root' /tmp/fastapi-fix.txt
          if grep -Fq '+ create .env.example' /tmp/fastapi-fix.txt || grep -Fq '~ append .gitignore' /tmp/fastapi-fix.txt || grep -Fq '+ create .gitignore' /tmp/fastapi-fix.txt; then
            echo 'nested fix must defer inherited repository-owned environment remediation'
            exit 1
          fi
          test ! -e "$FASTAPI_BACKEND/.env.example"

          mkdir -p "$ROOT/services/rust-api/src"
          cat > "$ROOT/services/rust-api/Cargo.toml" <<'TOML'
          [package]
          name = "rust-api"
          version = "0.1.0"

          [dependencies]
          axum = "0.8"
          TOML
          printf 'fn main() {}\n' > "$ROOT/services/rust-api/src/main.rs"

          "$BIN" inspect "$ROOT" | tee /tmp/root-inspect.txt
          grep -F 'aggregate repository view, not a single-service readiness score' /tmp/root-inspect.txt

          "$BIN" fix "$ROOT" --recipes-dir "$GITHUB_WORKSPACE/recipes" | tee /tmp/root-fix.txt
          grep -F '! StackPilot metadata — heterogeneous repository detected' /tmp/root-fix.txt
          if grep -Fq '+ create .stackpilot.toml' /tmp/root-fix.txt; then
            echo 'heterogeneous repository root must not be auto-adopted'
            exit 1
          fi
