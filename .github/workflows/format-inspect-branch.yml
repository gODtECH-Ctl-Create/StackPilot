name: Format inspect branch

on:
  push:
    branches:
      - feat/repository-inspect
    paths:
      - '.github/workflows/format-inspect-branch.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/repository-inspect

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust source
        run: cargo fmt --all

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Rust source already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: apply rustfmt to repository inspection"
          git push origin HEAD:feat/repository-inspect
