name: Implement monorepo awareness helper

on:
  push:
    branches:
      - fix/monorepo-awareness

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/monorepo-awareness
          fetch-depth: 0

      - name: Apply monorepo awareness patch
        run: python .github/scripts/patch_monorepo_awareness.py

      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git add src/git.rs src/inspect.rs src/security.rs src/readiness.rs src/fix.rs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make nested service inspection monorepo-aware"
          git push origin HEAD:fix/monorepo-awareness
