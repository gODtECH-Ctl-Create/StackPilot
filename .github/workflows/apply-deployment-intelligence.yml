name: Apply deployment intelligence helper

on:
  push:
    branches:
      - feat/deployment-intelligence-aws-ecs

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/deployment-intelligence-aws-ecs

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Wire CLI, inspection and safe remediation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor not found in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))

          main = Path("src/main.rs")
          replace_once(main, "mod doctor;\nmod fix;", "mod doctor;\nmod deployment;\nmod fix;")
          replace_once(
              main,
              "        /// Add the StackPilot security baseline (Dependabot plus hardened scanning workflow).\n        #[arg(long)]\n        security: bool,\n\n        /// Write the planned safe changes.",
              "        /// Add the StackPilot security baseline (Dependabot plus hardened scanning workflow).\n        #[arg(long)]\n        security: bool,\n\n        /// Add an explicit deployment foundation. Currently supported: aws-ecs-fargate.\n        #[arg(long, value_name = \"TARGET\")]\n        deployment: Option<String>,\n\n        /// Write the planned safe changes."
          )
          replace_once(
              main,
              "            cloud,\n            security,\n            apply,\n        } => {\n            let recipes_dir = resolve_recipes_dir(recipes_dir);\n            fix::run(&path, &recipes_dir, cloud.as_deref(), security, apply)?;",
              "            cloud,\n            security,\n            deployment,\n            apply,\n        } => {\n            let recipes_dir = resolve_recipes_dir(recipes_dir);\n            fix::run(\n                &path,\n                &recipes_dir,\n                cloud.as_deref(),\n                security,\n                deployment.as_deref(),\n                apply,\n            )?;"
          )

          inspect = Path("src/inspect.rs")
          replace_once(inspect, "use crate::security;", "use crate::{deployment, security};")
          replace_once(
              inspect,
              "    let stackpilot_metadata = files\n        .iter()\n        .any(|path| path.file_name().and_then(|name| name.to_str()) == Some(\".stackpilot.toml\"));\n\n    let mut findings = vec![",
              "    let stackpilot_metadata = files\n        .iter()\n        .any(|path| path.file_name().and_then(|name| name.to_str()) == Some(\".stackpilot.toml\"));\n    let deployment_recommendation =\n        deployment::recommendation(&root, &languages, &frameworks, docker.detected);\n    let ecs_foundation = deployment::foundation_detected(&root, deployment::AWS_ECS_FARGATE);\n\n    let mut findings = vec!["
          )
          replace_once(
              inspect,
              "    findings.extend(security::inspect(&root)?);\n\n    Ok(InspectionReport {",
              "    if ecs_foundation {\n        findings.push(Finding {\n            category: \"Infrastructure\",\n            name: \"Deployment target\",\n            status: FindingStatus::Passed,\n            detail: \"AWS ECS/Fargate foundation detected\".to_string(),\n            recommendation: None,\n        });\n    } else if let Some(recommendation) = deployment_recommendation {\n        findings.push(Finding {\n            category: \"Infrastructure\",\n            name: \"Deployment target\",\n            status: FindingStatus::Warning,\n            detail: format!(\n                \"Recommended: {} — {}\",\n                recommendation.label, recommendation.reason\n            ),\n            recommendation: Some(format!(\n                \"Preview the recommended foundation with `stackpilot fix . --deployment {}`.\",\n                recommendation.target\n            )),\n        });\n    }\n    findings.extend(security::inspect(&root)?);\n\n    Ok(InspectionReport {"
          )

          fix = Path("src/fix.rs")
          replace_once(
              fix,
              "use crate::{\n    inspect::{self, FindingStatus, InspectionReport},\n    readiness, scaffold,",
              "use crate::{\n    deployment,\n    inspect::{self, FindingStatus, InspectionReport},\n    readiness, scaffold,"
          )
          replace_once(
              fix,
              "    cloud: Option<&str>,\n    security_baseline: bool,\n    apply: bool,\n) -> Result<()> {\n    let plan = plan_repository_with_options(root, recipes_dir, cloud, security_baseline)?;",
              "    cloud: Option<&str>,\n    security_baseline: bool,\n    deployment_target: Option<&str>,\n    apply: bool,\n) -> Result<()> {\n    let plan = plan_repository_with_options(\n        root,\n        recipes_dir,\n        cloud,\n        security_baseline,\n        deployment_target,\n    )?;"
          )
          replace_once(
              fix,
              "    plan_repository_with_options(root, recipes_dir, cloud, false)\n}",
              "    plan_repository_with_options(root, recipes_dir, cloud, false, None)\n}"
          )
          replace_once(
              fix,
              "    cloud: Option<&str>,\n    security_baseline: bool,\n) -> Result<FixPlan> {",
              "    cloud: Option<&str>,\n    security_baseline: bool,\n    deployment_target: Option<&str>,\n) -> Result<FixPlan> {"
          )
          replace_once(
              fix,
              "    let cloud = normalize_cloud(cloud)?;\n    let deferred = plan_stack_fixes(\n        &root,",
              "    let deployment_target = deployment::normalize_target(deployment_target)?;\n    let cloud = if let Some(target) = deployment_target {\n        let required_cloud = deployment::required_cloud(target);\n        if let Some(explicit_cloud) = cloud\n            && !explicit_cloud.eq_ignore_ascii_case(required_cloud)\n        {\n            bail!(\n                \"deployment target '{target}' requires {required_cloud}; --cloud {explicit_cloud} conflicts with that target\"\n            );\n        }\n        Some(required_cloud)\n    } else {\n        cloud\n    };\n    let cloud = normalize_cloud(cloud)?;\n    let mut deferred = plan_stack_fixes(\n        &root,"
          )
          replace_once(
              fix,
              "    )?;\n    plan_metadata_fix(&root, &report, cloud, &mut changes)?;\n\n    Ok(FixPlan {",
              "    )?;\n    plan_deployment_fix(\n        &root,\n        &report,\n        recipes_dir,\n        deployment_target,\n        &mut changes,\n        &mut deferred,\n    )?;\n    plan_metadata_fix(&root, &report, cloud, &mut changes)?;\n\n    Ok(FixPlan {"
          )
          replace_once(
              fix,
              "super::plan_repository_with_options(repo.path(), Path::new(\"recipes\"), None, true)",
              "super::plan_repository_with_options(repo.path(), Path::new(\"recipes\"), None, true, None)"
          )

          anchor = "fn plan_health_fix(\n"
          text = fix.read_text()
          if anchor not in text:
              raise SystemExit("plan_health_fix anchor missing")
          deployment_fn = r'''fn plan_deployment_fix(
              root: &Path,
              report: &InspectionReport,
              recipes_dir: &Path,
              deployment_target: Option<&str>,
              changes: &mut Vec<PlannedChange>,
              deferred: &mut Vec<DeferredFix>,
          ) -> Result<()> {
              let Some(target) = deployment_target else {
                  return Ok(());
              };

              let profile = match verified_stack_profile(root, report) {
                  Ok(profile) => profile,
                  Err(reason) => {
                      deferred.push(DeferredFix {
                          control: "Deployment target",
                          reason: format!(
                              "deployment generation requires a verified golden-path stack: {reason}"
                          ),
                      });
                      return Ok(());
                  }
              };

              if !recipes_dir.is_dir() {
                  deferred.push(DeferredFix {
                      control: "Deployment target",
                      reason: format!(
                          "StackPilot recipes were not found at {}; pass --recipes-dir or reinstall StackPilot",
                          recipes_dir.display()
                      ),
                  });
                  return Ok(());
              }

              let docker_available = finding_status(report, "Docker") == Some(FindingStatus::Passed)
                  || changes.iter().any(|change| change.path == Path::new("Dockerfile"));
              if !docker_available {
                  deferred.push(DeferredFix {
                      control: "Deployment target",
                      reason: "AWS ECS/Fargate requires a Docker foundation; StackPilot could not verify or safely plan one"
                          .to_string(),
                  });
                  return Ok(());
              }

              if finding_status(report, "Terraform") == Some(FindingStatus::Passed)
                  && !deployment::existing_terraform_supports_aws(root)?
              {
                  deferred.push(DeferredFix {
                      control: "Deployment target",
                      reason: "existing Terraform does not expose AWS provider intent; refusing to mix an ECS/Fargate foundation into unknown infrastructure"
                          .to_string(),
                  });
                  return Ok(());
              }

              let files = deployment::foundation_files(target);
              let existing = files
                  .iter()
                  .filter(|relative| path_entry_exists(&root.join(relative)))
                  .count();
              if existing == files.len() {
                  return Ok(());
              }
              if existing > 0 {
                  deferred.push(DeferredFix {
                      control: "Deployment target",
                      reason: "a partial StackPilot ECS/Fargate foundation already exists; refusing to fill around infrastructure that may have been edited"
                          .to_string(),
                  });
                  return Ok(());
              }

              for relative in files {
                  let relative = Path::new(relative);
                  if let Some(path) = first_symlink_ancestor(root, relative)? {
                      bail!(
                          "refusing to create {} because its target path contains a symlink at {}",
                          relative.display(),
                          path.display()
                      );
                  }
                  changes.push(PlannedChange {
                      path: relative.to_path_buf(),
                      kind: ChangeKind::Create,
                      description: format!(
                          "add the {} deployment foundation for {} / {}",
                          target, profile.language, profile.framework
                      ),
                      content: deployment::render_foundation_file(
                          recipes_dir,
                          target,
                          relative,
                          &profile.project_name,
                      )?,
                  });
              }

              Ok(())
          }

          '''
          fix.write_text(text.replace(anchor, deployment_fn + anchor, 1))

      - name: Format and validate Rust changes
        run: |
          cargo fmt --all
          cargo check --all-targets --all-features --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all --locked

      - name: Commit permanent source wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/inspect.rs src/fix.rs src/deployment.rs
          git diff --cached --quiet || git commit -m 'feat: wire ECS Fargate deployment intelligence'
          git push origin HEAD:feat/deployment-intelligence-aws-ecs
