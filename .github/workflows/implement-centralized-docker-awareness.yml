name: Implement centralized Docker awareness

on:
  push:
    branches:
      - fix/centralized-docker-awareness

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/centralized-docker-awareness
          fetch-depth: 0

      - name: Patch centralized Docker ownership
        run: python .github/scripts/patch_centralized_docker.py

      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git add src/inspect.rs src/security.rs src/fix.rs .github/workflows/monorepo-awareness-smoke.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: detect centralized Docker ownership for nested services"
          git push origin HEAD:fix/centralized-docker-awareness
