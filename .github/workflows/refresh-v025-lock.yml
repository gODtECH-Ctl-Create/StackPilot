name: Refresh v0.2.5 lock helper

on:
  push:
    branches:
      - release/v0.2.5
    paths:
      - .github/workflows/refresh-v025-lock.yml

permissions:
  contents: write

jobs:
  refresh-and-validate:
    if: github.actor == 'gODtECH-Ctl-Create'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.2.5
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh Cargo lock metadata
        run: cargo check
      - name: Verify package and lock versions
        shell: bash
        run: |
          grep -A2 '^name = "stackpilot"$' Cargo.lock | grep 'version = "0.2.5"'
          grep '^version = "0.2.5"' Cargo.toml
          grep "currentVersion: '0.2.5'" website/src/data/site.ts
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build website
        working-directory: website
        run: |
          npm install
          npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit Cargo.lock only
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already aligned"
            exit 0
          fi
          git config user.name "gODtECH-Ctl-Create"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "release: refresh Cargo.lock for v0.2.5"
          git push origin HEAD:release/v0.2.5
