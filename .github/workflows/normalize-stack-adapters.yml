name: Normalize stack adapters

on:
  push:
    branches: [feat/fix-stack-adapters]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/fix-stack-adapters

      - name: Normalize validation result types
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/fix.rs')
          text = path.read_text()
          text = text.replace(') -> Result<StackProfile, String> {', ') -> std::result::Result<StackProfile, String> {')
          text = text.replace('fn cargo_package_name(root: &Path) -> Result<String, String> {', 'fn cargo_package_name(root: &Path) -> std::result::Result<String, String> {')
          text = text.replace('fn require_file(root: &Path, relative: &str) -> Result<(), String> {', 'fn require_file(root: &Path, relative: &str) -> std::result::Result<(), String> {')
          text = text.replace('fn read_required_text(root: &Path, relative: &str) -> Result<String, String> {', 'fn read_required_text(root: &Path, relative: &str) -> std::result::Result<String, String> {')
          path.write_text(text)
          PY

      - name: Install Rust tooling
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: Check
        run: |
          cargo check --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all

      - name: Commit normalized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fix.rs src/scaffold.rs src/main.rs
          git commit -m 'fix: normalize verified stack adapter validation'
          git push origin HEAD:feat/fix-stack-adapters
